<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0e16" />
    <title>NixOS Maze · watch</title>
    <link rel="icon" href="/img/nix-snowflake.svg" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="watch">
    <canvas id="view"></canvas>
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <div id="standby" class="standby hidden">
      <img src="/img/nix-snowflake.svg" alt="" />
      <h1>NO ONE IN THE MAZE</h1>
    </div>

    <aside class="join">
      <div id="qr" class="qr" role="img" aria-label="QR code to play"></div>
      <a class="join-button" href="/">join the maze</a>
    </aside>

    <script type="module" src="/js/watch.js"></script>
  </body>
</html>
