[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegame"
version = "1.0.0"
description = "Windows 95 style maze you play in a browser tab, with a spectator camera"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
mazegame = "mazegame.__main__:main"

[tool.setuptools]
packages = ["mazegame"]

[tool.setuptools.package-data]
mazegame = ["static/*.html", "static/css/*.css", "static/js/*.js", "static/img/*.svg"]
